<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2a1f">
<meta name="description" content="دُروب — دليل عربي لـ175 مسارًا وموقعًا طبيعيًا وتاريخيًا، بخرائط داخل الموقع ومعلومات زيارة من مصادرها.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دُروب">
<meta name="color-scheme" content="light">
<meta property="og:title" content="دُروب — خُطاك إلى الطبيعة">
<meta property="og:description" content="اكتشف المسارات والمواقع التراثية، قارن، خطّط، وتابع موقعك على الخريطة.">
<meta property="og:type" content="website">
<title>دُروب | خُطاك إلى الطبيعة</title>

<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="preconnect" href="https://thumb.wikimedia.org" crossorigin>
<link rel="preconnect" href="https://upload.wikimedia.org" crossorigin>
<link rel="preload" href="./vendor/fonts/plex-arabic-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./vendor/fonts.css">
<link rel="stylesheet" href="./vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="./css/doroub.css">
</head>

<body>

<!-- ======== شريط علوي واحد ======== -->
<header class="topbar on-photo" id="topbar">
  <a class="brand" href="#" data-go="home">
    <span class="glyph">⌁</span>
    <span>دُروب<small>خُطاك إلى الطبيعة</small></span>
  </a>
  <button type="button" class="topbar-act" data-act="search" aria-label="ابحث عن مكان"><span data-i="search"></span></button>
  <button type="button" class="topbar-act" data-act="settings" aria-label="الإعدادات"><span data-i="sliders"></span></button>
</header>

<div class="offline-bar" id="offlineBar" role="status" hidden>
  <span data-i="info"></span> أنت دون اتصال — ما حُفظ يعمل، أما الصور والخرائط فتحتاج إنترنت.
</div>

<main>

  <!-- ======== 1 · الرئيسية ======== -->
  <section class="screen active" id="screen-home">
    <div class="hero" id="homeHero"></div>
    <div class="wrap" id="homeBody"></div>
  </section>

  <!-- ======== 2 · الاستكشاف ======== -->
  <section class="screen" id="screen-explore">
    <div class="wrap">
      <div class="explore-head">
        <div class="search-row">
          <label class="search-box">
            <span data-i="search"></span>
            <input id="searchInput" type="search" autocomplete="off" enterkeyhint="search"
                   placeholder="ابحث عن مسار، مسجد، قلعة، وادٍ أو مدينة…" aria-label="البحث في دليل دُروب">
          </label>
          <button type="button" class="filter-btn" data-act="filters" aria-label="الفلاتر والترتيب">
            <span data-i="sliders"></span><span class="dot" id="filterDot" hidden>0</span>
          </button>
        </div>
        <div class="suggestions" id="suggestions" hidden></div>
        <div class="chip-row" id="themeChips" role="group" aria-label="تصفية سريعة حسب نوع التجربة"></div>
      </div>

      <div class="result-line">
        <span id="exploreCount"></span>
        <span id="exploreHint"></span>
      </div>

      <div class="cards" id="exploreCards" aria-live="polite"></div>

      <div class="empty" id="exploreEmpty" hidden>
        <span data-i="search"></span>
        <h3>لا توجد نتائج بهذه الشروط</h3>
        <p>جرّب منطقة أخرى أو أزل أحد الفلاتر.</p>
        <button type="button" class="btn btn-soft" data-act="reset-filters" style="margin-top:14px">إظهار كل الوجهات</button>
      </div>

      <button type="button" class="btn btn-soft btn-block" id="exploreMore" data-act="more" style="margin-top:18px" hidden></button>
    </div>
  </section>

  <!-- ======== 3 · الخريطة ======== -->
  <section class="screen map-screen" id="screen-map">
    <div class="map-canvas" id="mapCanvas"></div>
    <div class="map-float">
      <button type="button" data-act="map-layer" aria-label="تبديل طبقة الخريطة"><span data-i="layers"></span></button>
      <button type="button" data-act="map-locate" aria-label="موقعي الآن"><span data-i="locate"></span></button>
      <button type="button" data-act="search-here" aria-label="ابحث في هذه المنطقة"><span data-i="search"></span></button>
    </div>
    <div class="map-legend">
      <span><i></i> موقع معلم موثّق</span>
      <span><i class="area"></i> منطقة تقريبية</span>
      <span id="mapCounter"></span>
    </div>
  </section>

  <!-- ======== 4 · رحلتي ======== -->
  <section class="screen" id="screen-trip">
    <div class="wrap">
      <div class="block-head" style="margin-top:18px">
        <div><h2>رحلتي</h2><p>خطتك ومفضلتك محفوظتان على هذا الجهاز</p></div>
      </div>
      <div class="trip-tabs" id="tripTabs">
        <button type="button" class="on" data-triptab="plan">الخطة</button>
        <button type="button" data-triptab="saved">المفضلة</button>
        <button type="button" data-triptab="log">زياراتي</button>
      </div>
      <div id="tripBody"></div>
    </div>
  </section>

</main>

<!-- ======== ورقة الفلاتر ======== -->
<div class="sheet-root" id="filterSheet" role="dialog" aria-modal="true" aria-label="الفلاتر والترتيب">
  <div class="sheet-veil" id="filterVeil"></div>
  <div class="sheet">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h2>الفلاتر والترتيب</h2>
      <button type="button" class="sheet-close" data-act="close-sheet" aria-label="إغلاق"><span data-i="close"></span></button>
    </div>
    <div id="filterBody"></div>
    <div class="sheet-actions">
      <button type="button" class="btn btn-soft" data-act="reset-filters">مسح الكل</button>
      <button type="button" class="btn btn-primary" style="flex:1" id="filterApply" data-act="apply-filters">اعرض النتائج</button>
    </div>
  </div>
</div>

<!-- ======== الإعدادات ======== -->
<div class="sheet-root" id="settingsSheet" role="dialog" aria-modal="true" aria-label="الإعدادات">
  <div class="sheet-veil" id="settingsVeil"></div>
  <div class="sheet">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h2>الإعدادات</h2>
      <button type="button" class="sheet-close" data-act="close-settings" aria-label="إغلاق"><span data-i="close"></span></button>
    </div>
    <div id="settingsBody"></div>
  </div>
</div>

<!-- ======== المساهمة ======== -->
<div class="sheet-root" id="contributeSheet" role="dialog" aria-modal="true" aria-label="ساهم بمعلومة">
  <div class="sheet-veil" id="contributeVeil"></div>
  <div class="sheet">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h2>ساهم بمعلومة</h2>
      <button type="button" class="sheet-close" data-act="close-contribute" aria-label="إغلاق"><span data-i="close"></span></button>
    </div>
    <div id="contributeBody"></div>
  </div>
</div>

<!-- ======== صفحة المكان ======== -->
<div class="detail-root" id="detailRoot" role="dialog" aria-modal="true" aria-label="تفاصيل المكان">
  <div class="detail-veil" id="detailVeil"></div>
  <article class="detail" id="detailInner"></article>
</div>

<!-- ======== شريط التبويب ======== -->
<nav class="tabbar" aria-label="التنقل الرئيسي">
  <button type="button" data-tab="home" class="on"><span data-i="home"></span>الرئيسية</button>
  <button type="button" data-tab="explore"><span data-i="compass"></span>استكشف</button>
  <button type="button" data-tab="map"><span data-i="map"></span>الخريطة</button>
  <button type="button" data-tab="trip"><span data-i="bag"></span>رحلتي<span class="badge" id="tripBadge" hidden>0</span></button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="./vendor/leaflet/leaflet.js"></script>
<script src="./data/trails.js"></script>
<script src="./data/heritage.js"></script>
<script src="./data/open-places.js"></script>
<script src="./data/places.js"></script>
<script src="./data/wiki-cache.js"></script>
<script src="./data/ar-cache.js"></script>
<script src="./js/core.js"></script>
<script src="./js/photos.js"></script>
<script src="./js/map.js"></script>
<script src="./js/contribute.js"></script>
<script src="./js/detail.js"></script>
<script src="./js/app.js"></script>
</body>
</html>

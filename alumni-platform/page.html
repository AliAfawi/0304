<title>بوابة الخريجين</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: graph-paper notebook ground, one narrow column of white "index cards", blue ink for anything you can act on. */
:root {
  --bg: #EFECE3;
  --grid: rgba(46, 76, 150, .075);
  --surface: #FFFFFF;
  --surface-2: #F7F5EF;
  --ink: #16171C;
  --muted: #5D606D;
  --line: #DCD7CA;
  --accent: #2B5FD9;
  --accent-soft: rgba(43, 95, 217, .1);
  --on-accent: #FFFFFF;
  --good: #1D7F55;
  --warn: #A86A12;
  --bad: #B3372E;
  --shadow: 0 1px 0 rgba(20, 22, 30, .04), 0 6px 18px -10px rgba(20, 22, 30, .25);
  --f-display: "Alexandria", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111319; --grid: rgba(130, 160, 255, .06); --surface: #1A1D25; --surface-2: #15181F;
    --ink: #ECEDF2; --muted: #9DA1AE; --line: #2B2F3A; --accent: #7AA2FF; --accent-soft: rgba(122, 162, 255, .14);
    --on-accent: #0C1224; --good: #4CC18E; --warn: #E0A84A; --bad: #F07A70;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111319; --grid: rgba(130, 160, 255, .06); --surface: #1A1D25; --surface-2: #15181F;
  --ink: #ECEDF2; --muted: #9DA1AE; --line: #2B2F3A; --accent: #7AA2FF; --accent-soft: rgba(122, 162, 255, .14);
  --on-accent: #0C1224; --good: #4CC18E; --warn: #E0A84A; --bad: #F07A70;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { direction: rtl; }
body {
  margin: 0; font: 15px/1.65 var(--f-body); color: var(--ink);
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font: 800 18px/1 var(--f-display); white-space: nowrap; text-decoration: none; color: var(--ink); }
.mark { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: 900 17px/1 var(--f-display); }
.me-btn { margin-inline-start: auto; }
.tabs { border-top: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs .wrap { display: flex; gap: 2px; padding-block: 0; }
.tab { appearance: none; border: 0; background: none; padding: 11px 12px 9px; font: 600 14px/1 var(--f-body); color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab:hover { color: var(--ink); }

/* type */
.eyebrow { display: flex; align-items: center; gap: 12px; color: var(--accent); font: 700 14px/1.2 var(--f-display); margin: 0 0 10px; }
.eyebrow::after { content: ""; flex: 1; height: 2px; background: var(--accent); opacity: .85; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: clamp(30px, 6.4vw, 54px); font-weight: 900; line-height: 1.12; }
h2 { font-size: clamp(22px, 3.6vw, 30px); font-weight: 800; line-height: 1.25; }
h3 { font-size: 17px; font-weight: 700; line-height: 1.35; }
.lede { font-size: 17px; color: var(--ink); max-width: 62ch; margin: 12px 0 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; }

main { padding-block: 28px 64px; }
.view { display: grid; gap: 28px; }
.section { display: grid; gap: 14px; }
.head { display: grid; gap: 4px; }

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.plain { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
.grid-3 { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 560px) { .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; } }
.stat { background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 16px 14px; text-align: center; }
.stat b { display: block; font: 900 clamp(34px, 8vw, 60px)/1 var(--f-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.stat span { display: block; margin-top: 8px; font: 700 15px/1.3 var(--f-display); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.stack { display: grid; gap: 10px; }
.spread { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }

/* controls */
.btn { appearance: none; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; line-height: 1.2; }
.btn.blue { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink); }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.link { appearance: none; border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-weight: 600; }
.link.danger { color: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; color: var(--muted); }
input[type="text"], input[type="number"], input[type="url"], input[type="search"], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r); padding: 9px 11px; min-width: 0;
}
textarea { resize: vertical; min-height: 84px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; background: var(--surface); }
.form { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); }
.form .full { grid-column: 1 / -1; }
.check { display: flex; gap: 8px; align-items: center; font-weight: 600; }

/* items */
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.good { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
.pill.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.pill.grey { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.item { display: grid; gap: 8px; }
.item p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--muted); }
.who { font-weight: 700; color: var(--ink); }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 800 15px/1 var(--f-display); color: #fff; flex: none; }
.empty { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 22px 16px; text-align: center; color: var(--muted); background: color-mix(in srgb, var(--surface) 60%, transparent); }
.empty b { display: block; color: var(--ink); font-family: var(--f-display); margin-bottom: 4px; }
.replies { border-inline-start: 2px solid var(--line); padding-inline-start: 12px; display: grid; gap: 8px; }

/* banner */
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: var(--r); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); font-size: 14px; }
.banner.warn { background: color-mix(in srgb, var(--warn) 12%, transparent); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }

/* institutions */
.inst-grid { display: grid; gap: 14px 8px; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
.inst { min-width: 0; appearance: none; border: 0; background: none; cursor: pointer; display: grid; justify-items: center; gap: 6px; padding: 4px; text-align: center; color: var(--ink); }
.disc { width: 74px; height: 74px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line); display: grid; place-items: center; font: 800 13px/1.1 var(--f-display); padding: 6px; overflow: hidden; overflow-wrap: anywhere; transition: transform .15s ease; }
.inst:hover .disc { transform: translateY(-2px); border-color: var(--accent); }
.inst small { font-size: 12px; line-height: 1.3; font-weight: 600; }
.links { display: grid; gap: 8px; counter-reset: l; }
.links a { display: flex; align-items: center; gap: 12px; padding: 11px 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); text-decoration: none; color: var(--ink); font-weight: 700; }
.links a::before { counter-increment: l; content: counter(l); color: var(--accent); font: 800 17px/1 var(--f-display); min-width: 1.2em; }
.links a::after { content: "↖"; margin-inline-start: auto; color: var(--muted); }

.req { margin: 0; padding-inline-start: 1.2em; display: grid; gap: 6px; }
.req li { overflow-wrap: anywhere; }
h4 { margin: 0; font: 700 15px/1.3 var(--f-display); color: var(--accent); }
.inst-title { font-size: 19px; }
.about { margin: 0; }
.fac { display: grid; gap: 6px; }
.fac-name { font-size: 13px; font-weight: 700; color: var(--muted); }
.tag { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; background: var(--surface-2); border: 1px solid var(--line); }
.tag.hit { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* tools */
.tool-cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); }
.tool-card { appearance: none; text-align: start; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--accent); padding: 14px 16px; box-shadow: var(--shadow); display: grid; gap: 4px; color: var(--ink); }
.tool-card[aria-pressed="true"] { outline: 2px solid var(--accent); }
.tool-card b { font: 800 17px/1.3 var(--f-display); }
.tool-card span { color: var(--muted); font-size: 14px; }
.result { display: grid; gap: 4px; padding: 14px 16px; background: var(--accent-soft); border-radius: var(--r); }
.result b { font: 900 30px/1.1 var(--f-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: start; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 700; }
td input, td select { padding: 6px 8px; }
.he { direction: rtl; font-weight: 700; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--accent); }
.q { display: grid; gap: 6px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.scale { display: flex; flex-wrap: wrap; gap: 6px; }

/* chat */
.chat { display: grid; grid-template-rows: auto 1fr auto; height: min(560px, 70vh); padding: 0; overflow: hidden; }
.chat-head { padding: 10px 12px; border-bottom: 1px solid var(--line); }
.chat-body { overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); }
.msg { max-width: 82%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 7px 11px; align-self: flex-start; }
.msg.mine { align-self: flex-end; background: var(--accent-soft); border-color: transparent; }
.msg p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg .meta { font-size: 11px; }
.chat-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
.chat-form input { flex: 1; }

/* ideas */
.idea-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.idea-list li { display: flex; gap: 10px; align-items: baseline; padding: 9px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.idea-list .n { font: 700 12px/1 var(--f-display); color: var(--muted); min-width: 2.4em; font-variant-numeric: tabular-nums; }
.idea-list .t { flex: 1; min-width: 0; }

/* modal + toast */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: rgba(10, 12, 20, .45); }
.modal-box { width: min(640px, 100%); max-height: 100%; overflow-y: auto; background: var(--bg); border-radius: 10px; border: 1px solid var(--line); padding: 18px; display: grid; gap: 14px; }
.toast { position: fixed; z-index: 60; inset-inline: 0; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; width: max-content; max-width: calc(100% - 32px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; }
footer { border-top: 1px solid var(--line); padding-block: 18px; color: var(--muted); font-size: 13px; background: var(--surface); }
/*MODULE_CSS*/
.subnav { margin-bottom: 18px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#home" data-go="home"><span class="mark">خ</span>بوابة الخريجين</a>
    <button class="btn sm ghost me-btn" id="me-btn" type="button">ملفّي</button>
  </div>
  <nav class="tabs" aria-label="أقسام المنصة"><div class="wrap" id="tabs"></div></nav>
</header>

<main class="wrap" id="main"></main>

<footer><div class="wrap spread">
  <span>بوابة الخريجين · كل الأفواج بمكان واحد</span>
  <span id="mode-note"></span>
</div></footer>

<div id="modal-root"></div>
<div class="toast" id="toast" hidden></div>

<script>
/*MODULES*/
</script>

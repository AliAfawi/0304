<title>بوابة الخريجين</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Heebo:wght@400;500;700;800;900&display=swap">
<style>
/* Layout: graph-paper notebook ground, one narrow column of white "index cards", blue ink for anything you can act on. */
:root {
  --bg: #EFECE3;
  --grid: rgba(46, 76, 150, .075);
  --surface: #FFFFFF;
  --surface-2: #F7F5EF;
  --ink: #16171C;
  --muted: #5D606D;
  --line: #DCD7CA;
  --accent: #2B5FD9;
  --accent-soft: rgba(43, 95, 217, .1);
  --on-accent: #FFFFFF;
  --good: #1D7F55;
  --warn: #A86A12;
  --bad: #B3372E;
  --shadow: 0 1px 0 rgba(20, 22, 30, .04), 0 6px 18px -10px rgba(20, 22, 30, .25);
  --f-display: "Alexandria", "Heebo", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-body: "IBM Plex Sans Arabic", "Heebo", "Segoe UI", Tahoma, Arial, sans-serif;
  --r: 6px;
  --disc-l: 38%;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111319; --grid: rgba(130, 160, 255, .06); --surface: #1A1D25; --surface-2: #15181F;
    --ink: #ECEDF2; --muted: #9DA1AE; --line: #2B2F3A; --accent: #7AA2FF; --accent-soft: rgba(122, 162, 255, .14);
    --on-accent: #0C1224; --good: #4CC18E; --warn: #E0A84A; --bad: #F07A70; --disc-l: 72%;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111319; --grid: rgba(130, 160, 255, .06); --surface: #1A1D25; --surface-2: #15181F;
  --ink: #ECEDF2; --muted: #9DA1AE; --line: #2B2F3A; --accent: #7AA2FF; --accent-soft: rgba(122, 162, 255, .14);
  --on-accent: #0C1224; --good: #4CC18E; --warn: #E0A84A; --bad: #F07A70; --disc-l: 72%;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { direction: rtl; }
body {
  margin: 0; font: 15px/1.65 var(--f-body); color: var(--ink);
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font: 800 18px/1 var(--f-display); white-space: nowrap; text-decoration: none; color: var(--ink); }
.mark { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: 900 17px/1 var(--f-display); }
.me-btn { margin-inline-start: auto; }
.top-tools { display: flex; gap: 6px; align-items: center; flex: none; }
.top .wrap { min-width: 0; }
.me-btn { max-width: 10em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; }
@media (max-width: 520px) { .brand-text { display: none; } .top .wrap { gap: 8px; } .me-btn { max-width: 7.5em; } }
.icon-btn { appearance: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; font: 700 12px/1 var(--f-body); }
.icon-btn:hover { border-color: var(--ink); }
.icon-btn svg { width: 18px; height: 18px; }
.lang-btn { width: auto; padding: 0 12px; border-radius: 999px; }
:root[lang="he"] .he-hide { display: none !important; }
.tabs { border-top: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs .wrap { display: flex; gap: 2px; padding-block: 0; }
.tab { appearance: none; border: 0; background: none; padding: 11px 12px 9px; font: 600 14px/1 var(--f-body); color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab:hover { color: var(--ink); }

/* type */
.eyebrow { display: flex; align-items: center; gap: 12px; color: var(--accent); font: 700 14px/1.2 var(--f-display); margin: 0 0 10px; }
.eyebrow::after { content: ""; flex: 1; height: 2px; background: var(--accent); opacity: .85; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: clamp(30px, 6.4vw, 54px); font-weight: 900; line-height: 1.12; }
h2 { font-size: clamp(22px, 3.6vw, 30px); font-weight: 800; line-height: 1.25; }
h3 { font-size: 17px; font-weight: 700; line-height: 1.35; }
.lede { font-size: 17px; color: var(--ink); max-width: 62ch; margin: 12px 0 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; }

main { padding-block: 28px 64px; }
.view { display: grid; gap: 28px; }
.section { display: grid; gap: 14px; }
.head { display: grid; gap: 4px; }

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.plain { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
.grid-3 { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 560px) { .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; } }
.stat { background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 16px 14px; text-align: center; }
.stat b { display: block; font: 900 clamp(34px, 8vw, 60px)/1 var(--f-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.stat span { display: block; margin-top: 8px; font: 700 15px/1.3 var(--f-display); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.stack { display: grid; gap: 10px; }
.spread { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }

/* controls */
.btn { appearance: none; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; line-height: 1.2; }
.btn.blue { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink); }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.link { appearance: none; border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-weight: 600; }
.link.danger { color: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; color: var(--muted); }
input[type="text"], input[type="number"], input[type="url"], input[type="search"], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r); padding: 9px 11px; min-width: 0;
}
textarea { resize: vertical; min-height: 84px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; background: var(--surface); }
.form { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); }
.form .full { grid-column: 1 / -1; }
.check { display: flex; gap: 8px; align-items: center; font-weight: 600; }

/* items */
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.good { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
.pill.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.pill.grey { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.item { display: grid; gap: 8px; }
.item p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--muted); }
.who { font-weight: 700; color: var(--ink); }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 800 15px/1 var(--f-display); color: #fff; flex: none; }
.empty { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 22px 16px; text-align: center; color: var(--muted); background: color-mix(in srgb, var(--surface) 60%, transparent); }
.empty b { display: block; color: var(--ink); font-family: var(--f-display); margin-bottom: 4px; }
.replies { border-inline-start: 2px solid var(--line); padding-inline-start: 12px; display: grid; gap: 8px; }

/* banner */
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: var(--r); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); font-size: 14px; }
.banner.warn { background: color-mix(in srgb, var(--warn) 12%, transparent); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }

/* institutions */
.inst-grid { display: grid; gap: 14px 8px; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
.inst { min-width: 0; appearance: none; border: 0; background: none; cursor: pointer; display: grid; justify-items: center; gap: 6px; padding: 4px; text-align: center; color: var(--ink); }
.disc { width: 74px; height: 74px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line); display: grid; place-items: center; font: 800 13px/1.1 var(--f-display); padding: 6px; overflow: hidden; overflow-wrap: anywhere; transition: transform .15s ease; }
.disc { color: hsl(var(--disc-h, 220) 55% var(--disc-l)); }
.inst:hover .disc { transform: translateY(-2px); border-color: var(--accent); }
.inst small { font-size: 12px; line-height: 1.3; font-weight: 600; }
.links { display: grid; gap: 8px; counter-reset: l; }
.links a { display: flex; align-items: center; gap: 12px; padding: 11px 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); text-decoration: none; color: var(--ink); font-weight: 700; }
.links a::before { counter-increment: l; content: counter(l); color: var(--accent); font: 800 17px/1 var(--f-display); min-width: 1.2em; }
.links a::after { content: "↖"; margin-inline-start: auto; color: var(--muted); }

.req { margin: 0; padding-inline-start: 1.2em; display: grid; gap: 6px; }
.req li { overflow-wrap: anywhere; }
h4 { margin: 0; font: 700 15px/1.3 var(--f-display); color: var(--accent); }
.inst-title { font-size: 19px; }
.about { margin: 0; }
.fac { display: grid; gap: 6px; }
.fac-name { font-size: 13px; font-weight: 700; color: var(--muted); }
.tag { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; background: var(--surface-2); border: 1px solid var(--line); }
.tag-btn { cursor: pointer; color: var(--ink); font: inherit; font-size: 13px; }
.tag-btn:hover { border-color: var(--accent); }
.tag.verified { border-color: color-mix(in srgb, var(--good) 55%, var(--line)); }
.tag.verified::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--good); margin-inline-start: 6px; vertical-align: middle; }
.tag.hit { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* tools */
.tool-cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); }
.tool-card { appearance: none; text-align: start; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--accent); padding: 14px 16px; box-shadow: var(--shadow); display: grid; gap: 4px; color: var(--ink); }
.tool-card[aria-pressed="true"] { outline: 2px solid var(--accent); }
.tool-card b { font: 800 17px/1.3 var(--f-display); }
.tool-card span { color: var(--muted); font-size: 14px; }
.result { display: grid; gap: 4px; padding: 14px 16px; background: var(--accent-soft); border-radius: var(--r); }
.result b { font: 900 30px/1.1 var(--f-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: start; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 700; }
td input, td select { padding: 6px 8px; }
.he { direction: rtl; font-weight: 700; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--accent); }
.q { display: grid; gap: 6px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.scale { display: flex; flex-wrap: wrap; gap: 6px; }

/* chat */
.chat { display: grid; grid-template-rows: auto 1fr auto; height: min(560px, 70vh); padding: 0; overflow: hidden; }
.chat-head { padding: 10px 12px; border-bottom: 1px solid var(--line); }
.chat-body { overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); }
.msg { max-width: 82%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 7px 11px; align-self: flex-start; }
.msg.mine { align-self: flex-end; background: var(--accent-soft); border-color: transparent; }
.msg p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg .meta { font-size: 11px; }
.chat-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
.chat-form input { flex: 1; }

/* ideas */
.idea-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.idea-list li { display: flex; gap: 10px; align-items: baseline; padding: 9px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.idea-list .n { font: 700 12px/1 var(--f-display); color: var(--muted); min-width: 2.4em; font-variant-numeric: tabular-nums; }
.idea-list .t { flex: 1; min-width: 0; }

/* modal + toast */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: rgba(10, 12, 20, .45); }
.modal-box { width: min(640px, 100%); max-height: 100%; overflow-y: auto; background: var(--bg); border-radius: 10px; border: 1px solid var(--line); padding: 18px; display: grid; gap: 14px; }
.toast { position: fixed; z-index: 60; inset-inline: 0; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; width: max-content; max-width: calc(100% - 32px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; }
footer { border-top: 1px solid var(--line); padding-block: 18px; color: var(--muted); font-size: 13px; background: var(--surface); }
/* ===== community team (22 / 24 / 30-*) ===== */
.cm-suggest[hidden], .cm-anon-note[hidden], #st-form [hidden], #cm-composer [hidden] { display: none !important; }
.cm-who { flex-wrap: nowrap; min-width: 0; }
.cm-who .meta { min-width: 0; }
.cm-anon { background: var(--surface-2); color: var(--muted); border: 1px dashed var(--line); }
.cm-ver { font-size: 11px; padding: 1px 7px; }
.cm-pinned { border-inline-start: 4px solid var(--warn); }
.cm-mention { color: var(--accent); font-weight: 700; background: var(--accent-soft); border-radius: 4px; padding: 0 3px; }
.cm-anon-note { margin: 0; padding: 8px 12px; border-radius: var(--r); background: var(--accent-soft); }
.cm-actions { gap: 6px 14px; }
.cm-reply { padding: 8px 10px; border-radius: var(--r); }
.cm-best { background: color-mix(in srgb, var(--good) 10%, transparent); border: 1px solid color-mix(in srgb, var(--good) 40%, transparent); }
.cm-best-pill { justify-self: start; }
.cm-reply-form { flex-wrap: nowrap; }
.cm-reply-form .cm-mwrap { flex: 1; min-width: 0; }

/* @mention suggestions */
.cm-mwrap { position: relative; min-width: 0; }
.cm-suggest { position: absolute; inset-inline: 0; top: calc(100% + 4px); z-index: 15; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 4px; display: grid; gap: 2px; max-height: 260px; overflow-y: auto; }
.cm-sug-item { appearance: none; border: 0; background: none; display: flex; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 4px; cursor: pointer; text-align: start; color: var(--ink); min-width: 0; }
.cm-sug-item .avatar { width: 28px; height: 28px; font-size: 12px; }
.cm-sug-item[aria-selected="true"], .cm-sug-item:hover { background: var(--accent-soft); }
.cm-sug-name { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cm-room-note { margin: 0; }

/* stories */
.cm-story-text { line-height: 1.8; }
.cm-guide .req { font-size: 14px; }
.cm-year { font-size: 22px; color: var(--accent); border-bottom: 2px solid var(--line); padding-bottom: 4px; margin-top: 8px; }
.cm-home-opts { margin: 0; padding-inline-start: 1.2em; color: var(--muted); font-size: 14px; }

/* polls */
.cm-poll-opts { gap: 8px; }
.cm-poll-opt { appearance: none; position: relative; overflow: hidden; display: flex; gap: 8px; align-items: center; width: 100%; text-align: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); color: var(--ink); cursor: pointer; font-weight: 600; min-width: 0; }
.cm-poll-opt:hover:not(:disabled) { border-color: var(--accent); }
.cm-poll-opt:disabled { cursor: default; }
.cm-poll-opt.mine { border-color: var(--accent); }
.cm-poll-opt.lead .cm-poll-label { font-weight: 800; }
.cm-poll-fill { position: absolute; inset-block: 0; inset-inline-start: 0; background: var(--accent-soft); border-inline-end: 3px solid var(--accent); transition: width .3s ease; }
.cm-poll-label, .cm-poll-num, .cm-poll-opt .pill { position: relative; }
.cm-poll-label { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.cm-poll-num { font-size: 13px; color: var(--muted); white-space: nowrap; }

/* albums */
.cm-album-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); }
.cm-album { appearance: none; padding: 0; text-align: start; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; display: grid; color: var(--ink); min-width: 0; }
.cm-album:hover { border-color: var(--accent); }
.cm-album-cover { aspect-ratio: 4 / 3; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; }
.cm-album-cover img, .cm-album-cover .cm-ph-missing { width: 100%; height: 100%; object-fit: cover; }
.cm-album-ph { font: 900 28px/1 var(--f-display); color: var(--muted); opacity: .6; }
.cm-album-t { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 8px 10px; }
.cm-photo-grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(46%, 160px), 1fr)); }
.cm-photo { margin: 0; display: grid; gap: 6px; min-width: 0; }
.cm-photo-btn { appearance: none; padding: 0; display: grid !important; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; cursor: zoom-in; background: var(--surface-2); aspect-ratio: 1; display: block; width: 100%; }
.cm-photo-btn img, .cm-photo-btn .cm-ph-missing { width: 100%; height: 100%; object-fit: cover; display: block; }
.cm-photo-btn:hover { border-color: var(--accent); }
.cm-ph-missing { display: grid; width: 100%; height: 100%; place-items: center; color: var(--muted); font-size: 12px; background: var(--surface-2); padding: 8px; text-align: center; }
.cm-lightbox { min-width: 0; }
.cm-lb-img { width: 100%; max-height: 65vh; object-fit: contain; background: var(--surface-2); border-radius: var(--r); display: block; }
.cm-lightbox .cm-ph-missing { min-height: 200px; border-radius: var(--r); }
.cm-podium { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cm-podium li { display: grid; gap: 6px; min-width: 0; }
.cm-podium li:first-child .cm-photo-btn { border: 3px solid var(--warn); }
.cm-podium .meta { gap: 2px 6px; font-size: 12px; }

/* study groups */
.cm-dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 14px; }
.cm-dl dt { color: var(--muted); font-weight: 600; }
.cm-dl dd { margin: 0; min-width: 0; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cm-members { gap: 0; }
.cm-members > span:not(.muted) { margin-inline-end: -8px; }
.cm-members .avatar { width: 30px; height: 30px; font-size: 12px; border: 2px solid var(--surface); }
.cm-members .muted { margin-inline-start: 16px; }

/* where are our alumni */
.cm-bars-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
.cm-bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.cm-bar-row { appearance: none; width: 100%; border: 0; background: none; color: var(--ink); text-align: start; padding: 6px 4px; border-radius: 4px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; font-size: 14px; }
button.cm-bar-row { cursor: pointer; }
button.cm-bar-row:hover { background: var(--accent-soft); }
.cm-bar-label { min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
.cm-bar-num { font-size: 13px; color: var(--muted); white-space: nowrap; }
.cm-bar-track { grid-column: 1 / -1; height: 10px; background: var(--surface-2); border-radius: 0 4px 4px 0; overflow: hidden; }
.cm-bar-track i { display: block; height: 100%; min-width: 4px; background: var(--accent); border-radius: 4px 0 0 4px; }

/* rules */
.cm-rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; counter-reset: r; }
.cm-rules li { display: grid; gap: 4px; position: relative; padding-inline-start: 48px; }
.cm-rules li::before { counter-increment: r; content: counter(r); position: absolute; inset-inline-start: 14px; top: 14px; font: 900 20px/1 var(--f-display); color: var(--accent); }
.cm-rules p { margin: 0; }

/* shared by career / events / mentoring */
.cr-form input[type="date"], .cr-form input[type="datetime-local"], .cr-form input[type="time"] {
  width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r); padding: 8px 11px; min-width: 0; min-height: 42px;
}
.cr-form h3 { margin: 0; }
.cr-who { flex-wrap: nowrap; min-width: 0; }
.cr-who-t { min-width: 0; display: grid; gap: 0; }
.cr-name { gap: 6px; }
.cr-name .who { overflow-wrap: anywhere; }
.cr-report { color: var(--muted); font-weight: 500; }
.cr-report:disabled { cursor: default; opacity: .7; }
.cr-push { margin-inline-start: auto; }
.cr-kv { display: grid; gap: 2px; }
.cr-kv p { margin: 0; }

/* career */
.cr-job h3, .cr-idea h3 { overflow-wrap: anywhere; }
.cr-closed { opacity: .65; }
.cr-co { color: var(--ink); }
.cr-how { display: grid; gap: 4px; padding: 10px 12px; border-radius: var(--r); background: var(--surface-2); border: 1px solid var(--line); }
.cr-tip { display: grid; gap: 4px; border-inline-start: 3px solid var(--accent); padding-inline-start: 10px; }
.cr-rate { font-weight: 800; color: var(--accent); }
.cr-rank { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font-weight: 900; flex: none; }
.cr-rec { margin: 0; padding: 10px 12px; border-radius: var(--r); background: var(--surface-2); border-inline-start: 3px solid var(--good); display: grid; gap: 6px; }
.cr-rec p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }

/* mock interview */
.cr-iv { display: grid; grid-template-rows: auto minmax(220px, 1fr) auto; padding: 0; overflow: hidden; }
.cr-iv-head { padding: 12px 14px; border-bottom: 1px solid var(--line); }
.cr-iv-log { max-height: min(520px, 62vh); overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); }
.cr-iv-sys { align-self: center; text-align: center; }
.cr-iv-msg { max-width: 88%; }
.cr-iv-fb { max-width: 100%; border-color: color-mix(in srgb, var(--good) 45%, transparent); background: color-mix(in srgb, var(--good) 8%, var(--surface)); }
.cr-iv-compose { padding: 12px; border-top: 1px solid var(--line); }
.cr-iv-compose textarea { min-height: 72px; }

/* statistics: single-series horizontal bars, text in ink tokens */
.cr-chart h3 { font-size: 16px; }
.cr-bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.cr-bars li { display: grid; grid-template-columns: minmax(0, 9em) minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13px; }
.cr-bar-l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.cr-bar-t { height: 12px; display: block; }
.cr-bar-t i { display: block; height: 100%; background: var(--accent); border-radius: 4px 0 0 4px; }
.cr-bars li:hover .cr-bar-t i { filter: brightness(1.15); }
.cr-bar-v { color: var(--muted); font-size: 12px; white-space: nowrap; }
@media (max-width: 420px) { .cr-bars li { grid-template-columns: minmax(0, 7em) minmax(0, 1fr) auto; } }

/* events */
.ev-card { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 12px; align-items: start; }
.ev-card.ev-off h3 { text-decoration: line-through; color: var(--muted); }
.ev-date { display: grid; justify-items: center; align-content: start; gap: 2px; padding: 8px 4px; border-radius: var(--r); background: var(--accent-soft); color: var(--accent); }
.ev-date b { font: 900 24px/1 var(--f-display); }
.ev-date span { font: 700 12px/1.2 var(--f-display); text-align: center; }
.ev-body { display: grid; gap: 6px; min-width: 0; }
.ev-body h3 { overflow-wrap: anywhere; }
.ev-desc { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.ev-cap { display: grid; gap: 4px; max-width: 320px; }
.ev-manage { padding-top: 8px; border-top: 1px dashed var(--line); }
.ev-compact { padding: 12px; }
.ev-month { display: grid; gap: 12px; }
.ev-month-t { font-size: 18px; }
.ev-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.ev-wd { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); padding-bottom: 2px; }
.ev-cell { appearance: none; position: relative; min-width: 0; aspect-ratio: 1 / 1; max-height: 64px; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r); color: var(--ink); cursor: pointer; display: grid; place-items: center; padding: 0; font-weight: 600; font-size: 14px; }
.ev-cell.ev-blank { border-color: transparent; background: none; cursor: default; }
.ev-cell.has { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, transparent); color: var(--accent); font-weight: 800; }
.ev-cell.today { outline: 2px solid var(--ink); outline-offset: -2px; }
.ev-cell[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.ev-dots { position: absolute; bottom: 3px; inset-inline: 0; margin: 0 auto; min-width: 6px; height: 6px; width: max-content; border-radius: 99px; background: currentColor; font: 800 9px/1 var(--f-display); font-style: normal; }
.ev-dots:not(:empty) { height: auto; padding: 1px 4px; color: var(--on-accent); background: var(--accent); }
.ev-cell[aria-pressed="true"] .ev-dots:not(:empty) { background: var(--on-accent); color: var(--accent); }
@media (max-width: 420px) { .ev-card { grid-template-columns: 46px minmax(0, 1fr); gap: 10px; } .ev-date b { font-size: 20px; } }

/* mentoring */
.mt-pair { border-top: 4px solid var(--good); }
.mt-stars { color: var(--warn); font-weight: 700; letter-spacing: 1px; }
.mt-stars .num { color: var(--muted); letter-spacing: 0; }
.mt-slots { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 112px), 1fr)); }
.mt-slots-wide { grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); }
.mt-slots > .empty { grid-column: 1 / -1; }
.mt-slot { appearance: none; display: grid; gap: 2px; text-align: center; padding: 8px 6px; border-radius: var(--r); border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); background: var(--accent-soft); color: var(--ink); cursor: pointer; min-width: 0; }
.mt-slot:hover { border-color: var(--accent); }
.mt-slot b { font: 700 13px/1.3 var(--f-display); }
.mt-slot span { color: var(--accent); font-weight: 800; }
.mt-slot small { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mt-table td { overflow-wrap: anywhere; }
.mt-cell { gap: 0; }

/* 35 · tools & AI team */
.t35 { min-width: 0; }
.t35 input[type="date"], .t35 input[type="time"], .t35 input[type="email"], .t35 input[type="tel"],
.t35-chat textarea, .u36 input[type="date"] {
  width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r); padding: 9px 11px; min-width: 0; color: var(--ink);
}
.t35 input[type="range"] { width: 100%; accent-color: var(--accent); }
.t35 h2 { font-size: clamp(20px, 3.2vw, 26px); }
.t35-lock::before { content: "● "; color: var(--good); }
.t35-thinking { color: var(--muted); animation: t35-pulse 1.4s ease-in-out infinite; }
@keyframes t35-pulse { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .t35-thinking { animation: none; } }
.t35-ai-out:not(:empty) { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface-2); border: 1px solid var(--line); border-inline-start: 3px solid var(--accent); border-radius: var(--r); padding: 12px 14px; line-height: 1.8; }
.t35-two { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.t35-dl { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; margin: 0; }
.t35-dl dt { color: var(--muted); font-size: 14px; }
.t35-dl dd { margin: 0; font-weight: 800; }
.t35-narrow { min-width: 64px; }

/* chat */
.t35-chat { height: min(620px, 74vh); }
.t35-chat .chat-form { align-items: flex-end; }
.t35-chat .chat-form textarea { flex: 1; min-height: 44px; max-height: 140px; resize: none; }
.t35-chat .msg { max-width: 90%; }
.t35-bot { border-inline-start: 3px solid var(--accent); }
.t35-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); }
.t35-ask-hello { display: grid; gap: 8px; margin: auto 0; padding: 8px; }
.t35-ask-hello b { font: 800 18px/1.3 var(--f-display); }
.t35-ask-hello p { margin: 0; }
.t35-ask-hello .chip { text-align: start; white-space: normal; }

/* english ladder */
.t35-ladder { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; counter-reset: rung; }
.t35-rung { appearance: none; width: 100%; text-align: start; cursor: pointer; display: grid; gap: 2px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); color: var(--ink); }
.t35-ladder li:last-child .t35-rung { border-color: color-mix(in srgb, var(--good) 50%, var(--line)); }
.t35-rung[aria-pressed="true"] { outline: 2px solid var(--accent); background: var(--accent-soft); }
.t35-rung-name { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }

/* timetable */
.t35-week { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
.t35-week > p { grid-column: 1 / -1; margin: 0; }
.t35-slot { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 6px 10px; border-inline-start: 4px solid var(--accent); background: var(--surface-2); border-radius: 4px; }
.t35-time { font-size: 13px; font-weight: 700; color: var(--muted); }

/* pomodoro */
.t35-pomo-face { display: grid; gap: 8px; justify-items: center; padding: 18px 12px; background: var(--accent-soft); border-radius: var(--r); }
.t35-pomo-face b { font: 900 clamp(52px, 16vw, 84px)/1 var(--f-display); color: var(--accent); }
.t35-pomo-face .bar { width: min(320px, 100%); }
.t35-week-bars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; height: 130px; }
.t35-wb { display: grid; grid-template-rows: auto 1fr auto; justify-items: center; height: 100%; gap: 2px; min-width: 0; }
.t35-wb i { align-self: end; width: 70%; background: var(--accent); border-radius: 3px 3px 0 0; }
.t35-wb span { white-space: nowrap; overflow: hidden; max-width: 100%; }

/* checklist + reminders */
.t35-check-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding-block: 4px; border-bottom: 1px dashed var(--line); }
.t35-check-row:last-child { border-bottom: 0; }
.t35-check-row .check { font-weight: 500; align-items: flex-start; }
.t35-check-row .check input { margin-top: 5px; }
.t35-check-row input[type="date"] { width: 140px; padding: 5px 6px; font-size: 13px; }
.t35-check-row.done .check span { text-decoration: line-through; color: var(--muted); }
@media (max-width: 480px) { .t35-check-row { grid-template-columns: 1fr auto; } .t35-check-row input[type="date"] { grid-column: 1; width: 100%; } }
.t35-add input { flex: 1; min-width: 0; }
.t35-rem { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.t35-rem.past { opacity: .6; }
.t35-rem p { margin: 0; overflow-wrap: anywhere; }
.t35-rem-date { width: 52px; text-align: center; border: 1px solid var(--line); border-top: 4px solid var(--accent); border-radius: var(--r); padding: 4px 0; background: var(--surface); }
.t35-rem-date b { display: block; font-size: 20px; line-height: 1.1; }
.t35-rem-date span { font-size: 11px; color: var(--muted); }
.t35-past summary { cursor: pointer; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
.t35-home { border-top: 4px solid var(--accent); }
.t35-home .chip { white-space: normal; text-align: start; }

/* results */
.result.t35-neg { background: color-mix(in srgb, var(--bad) 12%, transparent); }
.result.t35-neg b { color: var(--bad); }
.t35-cmp td.num, .t35-cmp th { white-space: nowrap; }
.t35-he-text { font-size: 18px; line-height: 2; margin: 0; padding: 14px 16px; background: var(--surface-2); border-radius: var(--r); border: 1px solid var(--line); }
.chip.t35-right { background: color-mix(in srgb, var(--good) 18%, transparent); border-color: var(--good); color: var(--ink); }
.chip.t35-wrong { background: color-mix(in srgb, var(--bad) 14%, transparent); border-color: var(--bad); color: var(--ink); }
.t35 .chip:disabled { cursor: default; opacity: 1; }

/* CV + letter */
.t35-cv { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; overflow-wrap: anywhere; }
.t35-cv header { border-bottom: 2px solid var(--accent); padding-bottom: 8px; }
.t35-cv header p { margin: 2px 0 0; }
.t35-cv h4 { margin-bottom: 4px; }
.t35-cv ul { margin: 0; padding-inline-start: 1.2em; }
.t35-cv p { margin: 0; }
.t35-letter { min-height: 280px; line-height: 1.8; }

/* 36 · «جامعة» add-ons */
.u36-stars { letter-spacing: 1px; font-size: 16px; line-height: 1; white-space: nowrap; }
.u36-on { color: var(--warn); }
.u36-off { color: var(--line); }
.u36-avg { gap: 6px; }
.u36-report { color: var(--muted); }
.u36-star-btn { appearance: none; border: 0; background: none; cursor: pointer; font-size: 30px; line-height: 1; padding: 2px; color: var(--line); }
.u36-star-btn[aria-pressed="true"] { color: var(--warn); }
.u36-sum { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); }
.u36-sum:empty { display: none; }
.u36-sum-item { appearance: none; text-align: start; cursor: pointer; display: grid; gap: 4px; color: var(--ink); }
.u36-sum-item[aria-pressed="true"] { outline: 2px solid var(--accent); }
.u36-cmp { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 4px 12px 12px; }
.u36-cmp-label { grid-column: 1 / -1; padding-top: 12px; margin-top: 4px; border-top: 1px solid var(--line); font-size: 13px; }
.u36-cell { min-width: 0; padding-top: 6px; overflow-wrap: anywhere; }
.u36-cell .req { font-size: 14px; }
.u36-cell .tag { font-size: 12px; padding: 2px 8px; }
.u36-name { position: sticky; top: 92px; background: var(--surface); padding-block: 10px 8px; z-index: 1; border-bottom: 2px solid var(--accent); }
.u36-name h3 { font-size: 16px; }
.u36-dl.past { opacity: .62; }
.u36-dl-top { align-items: flex-start; flex-wrap: nowrap; gap: 12px; }

/* ===== 37: guides, content ===== */
.gd-h2 { font-size: clamp(19px, 3vw, 24px); }
.gd-cat-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
.gd-lib { gap: 28px; }
.gd-cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
.gd-card { appearance: none; text-align: start; cursor: pointer; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow);
  padding: 14px 16px; display: grid; gap: 6px; align-content: start; min-width: 0; transition: transform .15s ease, border-color .15s ease; }
.gd-card:hover { transform: translateY(-2px); border-color: var(--accent); }
.gd-card b { font: 800 17px/1.35 var(--f-display); text-wrap: balance; }
.gd-card-cat { font: 700 12px/1 var(--f-display); color: var(--accent); }
.gd-card-lede { color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.gd-card-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 2px; }
.gd-track { border-inline-start: 4px solid var(--accent); }
.gd-help h3 { margin-bottom: 2px; }
.gd-help p { margin: 0; }

/* reader */
.gd-head .lede { max-width: 60ch; }
.gd-layout { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) {
  .gd-layout { grid-template-columns: 220px minmax(0, 1fr); align-items: start; }
  .gd-toc { position: sticky; top: 120px; }
}
.gd-toc ol { margin: 8px 0 0; padding-inline-start: 1.3em; display: grid; gap: 6px; font-size: 14px; }
.gd-toc .link { text-align: start; font-weight: 600; }
.gd-article { max-width: 65ch; display: grid; gap: 30px; min-width: 0; font-size: 16.5px; line-height: 1.85; }
.gd-sec { display: grid; gap: 10px; scroll-margin-top: 130px; }
.gd-sec h2 { font-size: clamp(21px, 3.2vw, 26px); }
.gd-sec p { margin: 0; overflow-wrap: anywhere; }
.gd-sec > .pill { justify-self: start; }
.gd-mine { border-inline-start: 4px solid var(--accent); padding-inline-start: 14px; }
.gd-ul { margin: 0; padding-inline-start: 1.25em; display: grid; gap: 8px; }
.gd-ul li::marker { color: var(--accent); }
.gd-note { font-size: 14px; color: var(--muted); border: 1.5px dashed var(--line); border-radius: var(--r); padding: 8px 12px; }
.gd-tip { background: var(--surface); border: 1px solid var(--line); border-inline-start: 5px solid var(--accent); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow); }
.gd-tip b { font: 800 14px/1 var(--f-display); color: var(--accent); }
.gd-tip p { margin: 6px 0 0; font: 700 18px/1.6 var(--f-display); }
.gd-step { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; line-height: 1.5; }
.gd-step input { margin-top: 4px; flex: none; width: 18px; height: 18px; accent-color: var(--accent); }
.gd-step span:first-of-type { flex: 1; min-width: 0; }
.gd-step.done span:first-of-type { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.gd-progress { display: grid; gap: 6px; }
.gd-feedback { display: grid; gap: 10px; }
.gd-actions { border-top: 1px solid var(--line); padding-top: 14px; }
.gd-trip { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.gd-trip li { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); font-size: 15px; }
.gd-trip li span { min-width: 0; overflow-wrap: anywhere; }
.gd-trip .btn { flex: none; }
.gd-prose { display: grid; gap: 12px; font-size: 16.5px; line-height: 1.85; max-width: 65ch; }
.gd-prose p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }

// ---------- utilities ----------
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const $ = (s, r = document) => r.querySelector(s);
const fmt = (n) => Math.round(n).toLocaleString("ar-EG-u-nu-latn");
function safeUrl(u) {
  try { const x = new URL(String(u).trim()); return /^https?:$/.test(x.protocol) ? x.href : null; } catch { return null; }
}
function rel(ts) {
  if (!ts) return "";
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 60) return "الآن";
  if (s < 3600) return "قبل " + Math.floor(s / 60) + " د";
  if (s < 86400) return "قبل " + Math.floor(s / 3600) + " س";
  if (s < 86400 * 30) return "قبل " + Math.floor(s / 86400) + " يوم";
  return new Date(ts).toLocaleDateString("ar-EG-u-nu-latn");
}

const S = {
  view: "home", mode: "loading", uid: null, canWrite: true, isAdmin: false,
  alumni: {}, posts: [], materials: [], tutors: [], names: {}, mod: {},
};
let db = null, userCap = null;
const localSubs = {};
function localRead(col) { return lsGet("c:" + col, []); }
function localEmit(col) { (localSubs[col] || new Set()).forEach((f) => f()); }

function subscribe(col, { order = "createdAt", dir = "desc", limit = 300 } = {}, cb) {
  if (db) {
    try {
      return db.collection(col).orderBy(order, dir).limit(limit).onSnapshot(
        (s) => cb(s.docs.map((d) => ({ id: d.id, ...d.data() }))),
        (e) => { console.warn(col, e); toast("تعذّر تحميل جزء من البيانات، حدّث الصفحة"); }
      );
    } catch (e) { console.warn(e); return () => {}; }
  }
  const emit = () => {
    const rows = localRead(col).sort((a, b) => ((a[order] || 0) - (b[order] || 0)) * (dir === "desc" ? -1 : 1));
    cb(rows.slice(0, limit));
  };
  (localSubs[col] ||= new Set()).add(emit);
  emit();
  return () => localSubs[col].delete(emit);
}
function writeFailed(e) {
  console.warn(e);
  if (e && e.code === "invalid_argument") { S.canWrite = false; toast("ما عندك صلاحية المشاركة هنا، اطلب صلاحية «مساهم» من صاحب المنصة"); renderView(); }
  else if (e && e.code === "quota_exceeded") toast("امتلأت مساحة المنصة، لازم تحذف الإدارة محتوى قديم");
  else toast("ما انحفظ، جرّب مرة ثانية");
  return false;
}
async function addDoc(col, data) {
  if (!guardWrite()) return false;
  try {
    if (db) await db.collection(col).add(data);
    else { const a = localRead(col); a.push({ id: Math.random().toString(36).slice(2, 11), ...data }); lsSet("c:" + col, a); localEmit(col); }
    return true;
  } catch (e) { return writeFailed(e); }
}
async function setDoc(col, id, data) {
  if (!guardWrite()) return false;
  try {
    if (db) await db.collection(col).doc(id).set(data);
    else { const a = localRead(col).filter((x) => x.id !== id); a.push({ id, ...data }); lsSet("c:" + col, a); localEmit(col); }
    return true;
  } catch (e) { return writeFailed(e); }
}
async function getDoc(col, id) {
  try {
    if (db) { const s = await db.collection(col).doc(id).get(); return s.exists ? { id: s.id, ...s.data() } : null; }
    return localRead(col).find((x) => x.id === id) || null;
  } catch (e) { console.warn(e); return null; }
}
function subscribeDoc(col, id, cb) {
  if (db) {
    try { return db.collection(col).doc(id).onSnapshot((s) => cb(s.exists ? { id: s.id, ...s.data() } : null), (e) => console.warn(col, e)); }
    catch (e) { console.warn(e); return () => {}; }
  }
  const emit = () => cb(localRead(col).find((x) => x.id === id) || null);
  (localSubs[col] ||= new Set()).add(emit); emit();
  return () => localSubs[col].delete(emit);
}
async function delDoc(col, id) {
  try {
    if (db) await db.collection(col).doc(id).delete();
    else { lsSet("c:" + col, localRead(col).filter((x) => x.id !== id)); localEmit(col); }
    toast("انحذف");
  } catch (e) { writeFailed(e); }
}

  if (!S.canWrite || !S.uid) { toast("المشاركة غير متاحة لك هنا. تقدر تتصفّح كل شي."); return false; }

}

async function resolveNames(uids) {
  if (!userCap) return;
  const missing = [...new Set(uids)].filter((u) => u && !S.alumni[u] && !(u in S.names));

const VIEW_META = [];
// registerView(id, section, label, render?, {order, admin})
function registerView(id, section, label, render, opts = {}) {
  if (render) views[id] = render;
  VIEW_META.push({ id, section, label, order: opts.order ?? 50, admin: !!opts.admin });
}
const visibleViews = () => VIEW_META.filter((v) => !v.admin || S.isAdmin);
const sectionViews = (sec) => visibleViews().filter((v) => v.section === sec).sort((a, b) => a.order - b.order);
const sectionOf = (id) => VIEW_META.find((v) => v.id === id)?.section || "home";
function resolveView(v) {
  if (visibleViews().some((m) => m.id === v)) return v;
  const first = sectionViews(v)[0];
  return first ? first.id : "home";
}
function buildTabs() {
  const cur = sectionOf(S.view);
  $("#tabs").replaceChildren(...SECTIONS.filter(([id]) => sectionViews(id).length).map(([id, label]) =>
    h("button", { class: "tab", type: "button", "data-go": id, "aria-current": cur === id ? "page" : null, text: label })));
}
function subNav() {
  const list = sectionViews(sectionOf(S.view));
  if (list.length < 2) return null;
  return h("nav", { class: "subnav chips", "aria-label": "أقسام فرعية" }, list.map((m) =>
    h("button", { class: "chip", type: "button", "data-go": m.id, "aria-pressed": String(m.id === S.view), text: m.label })));
}
function go(v) {
  S.view = resolveView(v);
  buildTabs();
  renderView();
  window.scrollTo({ top: 0 });
  try { history.replaceState(null, "", "#" + S.view); } catch {}
  const cur = $(`.tab[aria-current="page"]`); cur && cur.scrollIntoView({ inline: "center", block: "nearest" });
}
document.addEventListener("click", (e) => {
  const g = e.target.closest("[data-go]");
  if (g) { e.preventDefault(); go(g.getAttribute("data-go")); }
});

function cmInst(place) {
  const p = norm(place).trim(); if (p.length < 3 || /^(ال)?(جامعه|كليه|معهد)$/.test(p)) return null;
  const strip = (x) => x.replace(/^(جامعه|كليه|معهد|الجامعه|الكليه)\s+/, "").replace(/\s+(في|ب)\s+.*$/, "");
  return INST.find((i) => { const a = norm(i.ar), he = norm(i.he); return p === a || p.includes(a) || a.includes(p) || p.includes(he) || (strip(p).length > 3 && strip(a).includes(strip(p))); }) || null;
}

async function cmToggleSave(col, id) {

function toggleReplies(p) {
  if (openReplies.has(p.id)) { openReplies.get(p.id).unsub(); openReplies.delete(p.id); cmRedrawPosts(); return; }

  const entry = { rows: [], loaded: false, unsub: () => {}, form: null, list: h("div", { class: "stack" }) };
  openReplies.set(p.id, entry);
  entry.unsub = subscribe(`posts/${p.id}/replies`, { dir: "asc", limit: 200 }, (rows) => { entry.rows = rows; entry.loaded = true; resolveNames(rows.map((r) => r.uid)); fillReplies(p.id); });

function cmRepliesBox(p, entry) {
  if (!entry.form) {
    const inp = h("input", { type: "text", id: "cm-reply-" + p.id, maxlength: 1000, placeholder: "اكتب ردّ… (@ لتذكر حدا)", "aria-label": "رد", autocomplete: "off" });

      const mentions = cmMentions(t);

      if (mentions.length) doc.mentions = mentions;
      if (await addDoc(`posts/${p.id}/replies`, doc)) {
        inp.value = "";

        cmNotify(post.uid, "reply", `${me} ردّ على ${post.anon ? "سؤالك المجهول" : "منشورك"}: «${cmSnippet(t)}»`, "feed");
        for (const u of mentions) if (u !== post.uid) cmNotify(u, "mention", `${me} ذكرك بردّ: «${cmSnippet(t)}»`, "feed");
      }
    });
    entry.form = f;

  const box = h("div", { class: "replies", "data-replies": p.id }, entry.list, entry.form);

function fillReplies(pid) {
  const entry = openReplies.get(pid); if (!entry) return;
  const p = S.posts.find((x) => x.id === pid) || { id: pid };
  const col = `posts/${pid}/replies`;
  let rows = entry.rows.filter((r) => !cmHidden(col, r.id));
  const best = rows.find((r) => r.id === p.best);
  if (best) rows = [best, ...rows.filter((r) => r !== best)];
  const isAuthor = p.uid && p.uid === S.uid;
  entry.list.replaceChildren(...(rows.length ? rows.map((r) => {
    const isBest = r.id === p.best;
    return h("div", { class: "item cm-reply" + (isBest ? " cm-best" : "") },
      isBest ? h("span", { class: "pill good cm-best-pill", text: "أفضل إجابة · اختارها صاحب السؤال" }) : null,
      h("div", { class: "meta" }, h("span", { class: "who", text: nameOf(r.uid) }), cmVerified(r.uid), h("span", { text: rel(r.createdAt) })),
      cmRich(r.text, r.mentions),
      h("div", { class: "row" },
        isAuthor && r.uid !== S.uid ? h("button", { class: "link small", type: "button", onclick: () => cmSetBest(p, isBest ? null : r), text: isBest ? "إلغاء أفضل إجابة" : "أفضل إجابة" }) : null,
        r.uid !== S.uid ? cmReportBtn(col + ":" + r.id) : null, rowActions(col, r)));
  }) : [h("p", { class: "muted small", text: entry.loaded ? "ما في ردود لسا. كن أول واحد يساعد." : "جارِ تحميل الردود…" })]));
}
async function cmSetBest(p, r) {
  const cur = S.posts.find((x) => x.id === p.id) || p;
  const { id, ...data } = cur;
  if (r) data.best = r.id; else delete data.best;
  if (await setDoc("posts", p.id, data)) {

    if (r) cmNotify(r.uid, "best", `ردّك انختار «أفضل إجابة» على: «${cmSnippet(cur.text)}»`, "feed");
  }
}

// ---------- dates ----------
function lnDay(d = new Date()) { const z = new Date(d); return `${z.getFullYear()}-${String(z.getMonth() + 1).padStart(2, "0")}-${String(z.getDate()).padStart(2, "0")}`; }
const lnToday = () => lnDay();
function lnDaysTo(s) { return Math.round((new Date(s + "T00:00") - new Date(lnToday() + "T00:00")) / 86400000); }
function lnAddDays(s, n) { const d = new Date(s + "T00:00"); d.setDate(d.getDate() + n); return lnDay(d); }
function lnDate(s, long) {
  const d = new Date(String(s).length > 10 ? s : s + "T00:00");
  if (isNaN(d)) return String(s || "");
  return d.toLocaleDateString("ar-EG-u-nu-latn", long ? { weekday: "long", day: "numeric", month: "long" } : { day: "numeric", month: "numeric", year: "numeric" });
}
function lnSlot(s) {
  const d = new Date(s);
  return isNaN(d) ? String(s) : d.toLocaleString("ar-EG-u-nu-latn", { weekday: "short", day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" });
}
function lnLeft(n) { return n === 0 ? "اليوم" : n === 1 ? "بكرا" : n < 0 ? "خلص" : n <= 10 ? `بعد ${n} أيام` : `بعد ${n} يوم`; }

function lnSummarize(m) {
  const out = h("div", { class: "result ln-ai", "aria-live": "polite" }, h("span", { class: "muted small", text: "الملخص بيطلع هون." }));

  const btn = h("button", { class: "btn blue", type: "button", text: "لخّص" });
  btn.addEventListener("click", async () => {
    const pasted = ta.value.trim();
    if (!pasted && !(m && (m.note || "").trim().length > 20)) { toast("الصق نص من المادة أولًا، المساعد ما بيقدر يفتح الملف"); return; }
    btn.disabled = true;

// ===== 31-cards.js =====
// ===== learning: flashcards with SM-2 spaced repetition (52), self-quiz (53), vocabulary lists (51) =====
// Private decks: myCol() docs {t:"ln-deck"}; per-deck progress: myCol() doc "ln-prog-<deckKey>" {states:{cardKey:{e,i,r,due}}}.
// Public decks: collection "decks". Vocabulary lists: collection "vocab".
const lnMyDecks = () => LN.mine.filter((r) => r.t === "ln-deck").sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
const lnDeckKey = (d, pub) => (pub ? "p-" : "m-") + d.id;
function lnHash(s) { let x = 5381; for (const c of String(s)) x = ((x * 33) ^ c.charCodeAt(0)) >>> 0; return x.toString(36); }
const lnCardKey = (c) => lnHash(c.f + "\u0001" + c.b);
const lnProg = (key) => lnMine("ln-prog-" + key)?.states || {};
function lnDue(d, key) {
  const st = lnProg(key), t = lnToday();
  return (d.cards || []).filter((c) => { const s = st[lnCardKey(c)]; return !s || s.due <= t; }).length;
}
// SM-2: q = 1 (ما عرفتها), 3 (صعبة), 5 (سهلة).
function lnSm2(s, q) {
  let { e = 2.5, i = 0, r = 0 } = s || {};
  if (q < 3) { r = 0; i = 1; } else { r += 1; i = r === 1 ? 1 : r === 2 ? 6 : Math.round(i * e); }
  e = Math.max(1.3, e + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02)));
  return { e: +e.toFixed(2), i, r, due: lnAddDays(lnToday(), i) };
}
function lnParseLines(text, cols) {
  return String(text).split("\n").map((l) => l.split(/\s*[|\t]\s*/).map((x) => x.trim())).filter((p) => p[0] && (cols === 3 ? p.length >= 2 : p[1]))
    .slice(0, 300);
}

// Generic multiple-choice runner (used by deck quizzes and psychometric practice). items: [{q, options, correct, explain}]
function lnRunner(items, { onDone, onAgain } = {}) {
  let i = 0, score = 0, picked = null;
  const root = h("div", { class: "card stack ln-run", tabindex: "0", "aria-live": "polite" });
  const choose = (k) => { if (picked != null || i >= items.length || k >= items[i].options.length) return; picked = k; if (k === items[i].correct) score++; paint(); };
  const next = () => { if (picked == null) return; i++; picked = null; if (i >= items.length && onDone) onDone(score, items.length); paint(); };
  const paint = () => {
    if (i >= items.length) {
      const pct = Math.round((score / items.length) * 100);

const lnShuffle = (a) => { const x = [...a]; for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; } return x; };

function lnStudy(d, key) {
  const cards = d.cards || [];
  if (!cards.length) { toast("الرزمة فاضية"); return; }
  const t = lnToday(), st0 = lnProg(key);
  let queue = cards.filter((c) => { const s = st0[lnCardKey(c)]; return !s || s.due <= t; });
  const free = !queue.length;
  if (free) queue = lnShuffle(cards);
  let i = 0, flipped = false, done = 0;
  const states = { ...st0 };
  const box = h("div", { class: "stack ln" });
  const grade = (q) => {
    const c = queue[i]; const k = lnCardKey(c);
    states[k] = lnSm2(states[k], q); done++;
    if (q < 3) queue.push(c);
    if (S.uid && S.canWrite) lnSaveMine("ln-prog-" + key, { t: "ln-prog", deck: key, states });
    i++; flipped = false; paint();
  };
  const paint = () => {
    if (i >= queue.length) {
      box.replaceChildren(h("div", { class: "result" }, h("span", { text: "خلصت الجلسة" }), h("b", { class: "num", text: `${done}` }), h("span", { text: "بطاقة راجعتها. البطاقات بترجعلك بالوقت المناسب حسب كيف عرفتها." })),
        h("div", { class: "row" }, h("button", { class: "btn ghost", type: "button", onclick: () => { queue = lnShuffle(cards); i = 0; paint(); }, text: "مراجعة حرّة لكل البطاقات" })));
      return;
    }
    const c = queue[i];
    const cardEl = h("div", { class: "ln-flash" + (flipped ? " flipped" : ""), role: "button", tabindex: "0", "aria-label": flipped ? "الجواب" : "السؤال، اكبس لتقلب", onclick: () => { flipped = !flipped; paint(); } },
      h("span", { class: "muted small", text: flipped ? "الظهر" : "الوجه" }), h("span", { class: "ln-flash-t", dir: "auto", text: flipped ? c.b : c.f }));
    box.replaceChildren(
      h("div", { class: "spread" }, h("span", { class: "muted small num", text: `${i + 1} / ${queue.length}` }), free ? h("span", { class: "pill grey", text: "ما في مستحق اليوم، مراجعة حرّة" }) : h("span", { class: "pill", text: "مستحقة اليوم" })),
      cardEl,
      flipped ? h("div", { class: "row ln-grades" },
        h("button", { class: "btn ghost", type: "button", onclick: () => grade(1), text: "1 · ما عرفتها" }),
        h("button", { class: "btn ghost", type: "button", onclick: () => grade(3), text: "2 · صعبة" }),
        h("button", { class: "btn blue", type: "button", onclick: () => grade(5), text: "3 · سهلة" }))
        : h("div", { class: "row" }, h("button", { class: "btn blue", type: "button", onclick: () => { flipped = true; paint(); }, text: "اقلب البطاقة" }),
          h("button", { class: "btn ghost", type: "button", disabled: i === 0 ? true : null, onclick: () => { i = Math.max(0, i - 1); paint(); }, text: "السابقة" }),
          h("button", { class: "btn ghost", type: "button", onclick: () => { i++; paint(); }, text: "تخطّى" })),
      h("p", { class: "muted small", text: "مفاتيح: مسافة أو Enter للقلب، 1/2/3 للتقييم، الأسهم للتنقّل." }));
    queueMicrotask(() => box.querySelector(".ln-flash")?.focus({ preventScroll: true }));
  };
  box.addEventListener("keydown", (e) => {
    if (i >= queue.length) return;
    if ((e.key === " " || e.key === "Enter") && e.target.classList.contains("ln-flash")) { e.preventDefault(); flipped = !flipped; paint(); }
    else if (flipped && ["1", "2", "3"].includes(e.key)) { e.preventDefault(); grade([1, 3, 5][+e.key - 1]); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); i++; flipped = false; paint(); }
    else if (e.key === "ArrowRight") { e.preventDefault(); i = Math.max(0, i - 1); flipped = false; paint(); }
  });
  paint();

function lnQuiz(d) {

}

function lnMakePlan(exams, { start, hours, rest }) {
  const ex = exams.filter((e) => e.date >= start).sort((a, b) => (a.date < b.date ? -1 : 1));
  if (!ex.length) return [];
  const last = ex[ex.length - 1].date, days = [];
  for (let d = start, k = 0; d <= last && k < 150; d = lnAddDays(d, 1), k++) {
    const dow = new Date(d + "T00:00").getDay();
    const todayEx = ex.filter((e) => e.date === d);
    const items = todayEx.map((e) => ({ s: e.subject, h: 0, note: "يوم الامتحان" }));
    const next = ex.filter((e) => e.date > d);
    const tomorrow = lnAddDays(d, 1);
    const eve = next.find((e) => e.date === tomorrow);
    if (!next.length) { days.push({ d, items }); continue; }
    if (rest !== "" && dow === +rest && !eve) { days.push({ d, items: [...items, { s: "", h: 0, note: "راحة" }] }); continue; }
    let avail = todayEx.length ? Math.floor(hours) / 2 : hours;
    avail = Math.round(avail * 2) / 2;
    if (avail <= 0) { days.push({ d, items }); continue; }
    if (eve) { items.push({ s: eve.subject, h: avail, note: "مراجعة نهائية وامتحان سابق بوقت" }); days.push({ d, items }); continue; }
    const w = next.map((e) => ({ e, w: (e.diff || 2) / Math.max(1, (new Date(e.date + "T00:00") - new Date(d + "T00:00")) / 86400000) }))
      .sort((a, b) => b.w - a.w).slice(0, hours >= 5 ? 3 : 2);
    const tot = w.reduce((s, x) => s + x.w, 0);
    let left = avail;
    w.forEach((x, i) => {
      let hh = i === w.length - 1 ? left : Math.max(0.5, Math.round((avail * x.w / tot) * 2) / 2);
      hh = Math.min(hh, left); left -= hh;
      if (hh <= 0) return;
      const n = Math.round((new Date(x.e.date + "T00:00") - new Date(d + "T00:00")) / 86400000);
      items.push({ s: x.e.subject, h: hh, note: n > 14 ? "فهم وتلخيص المادة" : n > 6 ? "تمارين وأسئلة" : "امتحانات سابقة بوقت" });
    });
    days.push({ d, items });
  }
  return days;
}

// time bank (70), volunteer hours (78) and certificate (79). Data: bookings, bookconf (written by the tutor), tutorreviews.
const LN_BSTATUS = { pending: "بانتظار ردّ المعلّم", accepted: "مؤكّد", declined: "انرفض أو انلغى", done: "تمّ الدرس" };
const lnStatus = (b) => lnTut.conf[b.id]?.status || "pending";
const lnOfferFree = (o) => !!o && (o.format === LN_FREE || (o.type === "offer" && !o.price));
const lnLive2 = (b) => lnStatus(b) !== "declined";
const lnSlotTaken = (offerId, slot) => lnTut.bookings.some((b) => b.offer === offerId && b.slot === slot && lnLive2(b));
const lnGroupCount = (offerId) => lnTut.bookings.filter((b) => b.offer === offerId && b.group && lnLive2(b)).length;
function lnRating(offerId) {
  const r = lnTut.reviews.filter((x) => x.target === offerId);
  return { n: r.length, avg: r.length ? r.reduce((s, x) => s + (+x.stars || 0), 0) / r.length : 0, list: r };
}

// Score how well an offer fits a help request (80).
function lnMatchScore(req, o) {
  if (o.subject !== req.subject || o.uid === req.uid) return -1;
  let s = 5; const why = [];
  const nums = (t) => new Set(String(t || "").match(/\d/g) || []);
  const a = nums(req.level), b = nums(o.level);
  if (a.size && b.size && [...a].some((x) => b.has(x))) { s += 2; why.push("نفس المستوى"); }
  const online = (m) => m === "أونلاين" || m === "الطريقتين";
  const face = (m) => m === "وجهًا لوجه" || m === "الطريقتين";
  if ((online(req.mode) && online(o.mode)) || (face(req.mode) && face(o.mode))) s += 1; else s -= 2;
  if (req.area && o.area && norm(req.area).trim() === norm(o.area).trim()) { s += 2; why.push("نفس المنطقة"); }
  else if (online(o.mode) && online(req.mode)) why.push("أونلاين");
  if (!o.price) { s += 0.5; why.push("مجاني"); }
  const r = lnRating(o.id); if (r.n) s += r.avg / 5;
  return { s, why };
}

function askSend(textIn) {

  ASK.busy = true; ASK.partial = ""; ASK.draft = "";

  const recent = ASK.turns.filter((t) => t.role === "user").slice(-3).map((t) => t.content).join("\n");
  const history = ASK.turns.slice(-24);
  while (history.length && history[0].role !== "user") history.shift();

    if (keep) ASK.turns.push({ role: "assistant", content: keep + (e && e.code === "cancelled" ? "\n\n(وقّفت الجواب)" : "") });

function t35BagrutAvg() {
  const rows = lsGet("bagrut", null); if (!rows) return null;
  let su = 0, s = 0;
  rows.forEach(([subj, u, g]) => { if (!u || isNaN(g)) return; const b = g < 60 ? 0 : u >= 5 ? (String(subj).includes("رياض") ? 35 : 25) : u === 4 ? 12.5 : 0; su += u; s += (g + b) * u; });
  return su ? +(s / su).toFixed(2) : null;
}

function t35Ics(rows) {
  const esc = (s) => String(s || "").replace(/[\\;,]/g, (c) => "\\" + c).replace(/\n/g, "\\n");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const ev = rows.map((r) => {
    const d = r.date.replace(/-/g, "");
    const start = r.time ? `DTSTART:${d}T${r.time.replace(":", "")}00` : `DTSTART;VALUE=DATE:${d}`;
    return ["BEGIN:VEVENT", `UID:${r.id}@alumni-portal`, `DTSTAMP:${stamp}`, start, `SUMMARY:${esc(r.title)}`, r.note ? `DESCRIPTION:${esc(r.note)}` : null,
      "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${esc(r.title)}`, "TRIGGER:-P1D", "END:VALARM", "END:VEVENT"].filter(Boolean).join("\r\n");
  });
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//alumni-portal//ar", "CALSCALE:GREGORIAN", ...ev, "END:VCALENDAR"].join("\r\n");
}

const T35_READ = "ביום הראשון באוניברסיטה, נועה הגיעה לקמפוס מוקדם בבוקר. היא חיפשה את הבניין של הפקולטה למדעי החברה, אבל המפה באתר הייתה מבלבלת. סטודנטית משנה שנייה ראתה אותה עומדת ליד הספרייה והציעה לעזור. בדרך הן דיברו על מערכת השעות, על הקורסים הקשים בסמסטר הראשון ועל החשיבות של שעות הקבלה של המרצים. הסטודנטית סיפרה שבשנה שעברה היא כמעט נכשלה בקורס סטטיסטיקה, עד שהתחילה ללמוד בקבוצה עם חברים מהכיתה. נועה רשמה לעצמה את הטיפ הזה. אחרי ההרצאה הראשונה היא הלכה לדיקנאט הסטודנטים ושאלה על מלגות. העובדת שם הסבירה לה שצריך להגיש בקשה עד סוף החודש, ולצרף אישור לימודים ומסמכים על המצב הכלכלי של המשפחה. בערב נועה התקשרה לאמא שלה וסיפרה שהיום היה ארוך, אבל היא מרגישה שהיא במקום הנכון.";
const T35_READ_Q = [
  ["ليش نوعا احتاجت مساعدة بالصبح؟", ["الخريطة بموقع الجامعة كانت مربكة", "تأخرت عن المحاضرة", "نسيت بطاقة الطالب", "ما لقت موقف للسيارة"], 0],
  ["شو النصيحة اللي أخذتها من الطالبة؟", ["تأجّل مساق الإحصاء لسنة الجاي", "تدرس بمجموعة مع أصحاب من الصف", "تسكن بالمعونوت", "تسجّل لمساقات أقل"], 1],
  ["شو لازم ترفق مع طلب المنحة؟", ["شهادة البجروت بس", "رسالة توصية من محاضر", "إثبات تعليم ووثائق عن وضع العائلة المادي", "علامة البسيخومتري"], 2],
];
const READ = { phase: "intro", t0: 0, secs: 0, ans: {} };
function toolReading(el) {
  const words = T35_READ.split(/\s+/).length;
  const hist = lsGet("p35:read", []);
  const re = () => toolReading(el);
  let body;
  if (READ.phase === "intro") {
    body = [h("p", { text: `رح يظهر نص قصير بالعبري (${words} كلمة) عن أول يوم بالجامعة. اقرأه بسرعتك العادية وافهمه، مش بسرعة زيادة. بعدها 3 أسئلة فهم.` }),
      h("button", { class: "btn blue", type: "button", text: "ابدأ القراءة", onclick: () => { READ.phase = "read"; READ.t0 = Date.now(); READ.ans = {}; re(); } })];
  } else if (READ.phase === "read") {
    body = [h("p", { class: "t35-he-text", dir: "rtl", lang: "he", text: T35_READ }),
      h("button", { class: "btn blue", type: "button", text: "خلصت القراءة", onclick: () => { READ.secs = Math.max(1, (Date.now() - READ.t0) / 1000); READ.phase = "quiz"; re(); } })];
  } else {
    const wpm = Math.round(words / (READ.secs / 60));
    const done = Object.keys(READ.ans).length === T35_READ_Q.length;
    const score = T35_READ_Q.filter((q, k) => READ.ans[k] === q[2]).length;
    body = [h("div", { class: "result" }, h("span", { class: "muted", text: "سرعة القراءة" }), h("b", { text: `${wpm} كلمة/دقيقة` }), h("span", { class: "small", text: `قرأت ${words} كلمة بـ ${Math.round(READ.secs)} ثانية` })),
      ...T35_READ_Q.map(([q, opts, right], k) => h("div", { class: "q" }, h("b", { text: `${k + 1}. ${q}` }),
        h("div", { class: "chips" }, opts.map((o, n) => h("button", { class: "chip" + (done ? (n === right ? " t35-right" : READ.ans[k] === n ? " t35-wrong" : "") : ""), type: "button", "aria-pressed": String(READ.ans[k] === n), disabled: done ? true : null, text: o,
          onclick: () => { READ.ans[k] = n; if (Object.keys(READ.ans).length === T35_READ_Q.length) { const s = T35_READ_Q.filter((x, j) => READ.ans[j] === x[2]).length; hist.unshift({ d: Date.now(), wpm, s }); lsSet("p35:read", hist.slice(0, 10)); } re(); } }))))),
      done ? h("div", { class: "result" }, h("span", { class: "muted", text: "الفهم" }), h("b", { text: `${score} من 3` }), h("span", { class: "small", text: score === 3 ? "قراءة سريعة مع فهم كامل. ممتاز." : "السرعة بتفيد بس إذا الفهم كامل. جرّب تقرأ أبطأ شوي المرة الجاي." })) : null,
      done ? h("button", { class: "btn ghost", type: "button", text: "جرّب مرة ثانية", onclick: () => { READ.phase = "intro"; re(); } }) : null];
  }
  t35Fill(el, t35Wrap("اختبار سرعة القراءة بالعبري", "الجامعة يعني قراءة كثير بالعبري. قيس سرعتك وفهمك، وارجع جرّب كل كم أسبوع لتشوف تقدّمك.", ...body,
    hist.length ? h("div", { class: "plain stack" }, h("h4", { text: "محاولاتك السابقة" }), h("div", { class: "table-wrap" }, h("table", null,
      h("thead", null, h("tr", null, h("th", { text: "متى" }), h("th", { text: "كلمة/دقيقة" }), h("th", { text: "الفهم" }))),
      h("tbody", null, hist.map((x) => h("tr", null, h("td", { text: rel(x.d) }), h("td", { class: "num", text: x.wpm }), h("td", { class: "num", text: `${x.s}/3` }))))))) : null,
    h("p", { class: "muted small", text: "قارن حالك مع حالك. ما في «علامة نجاح» هون، والأسئلة للفهم بس." })));
}

// ---------- 112 · CV generator ----------
const T35_CV_L = {
  ar: { dir: "rtl", name: "العربية", summary: "نبذة", edu: "التعليم", exp: "الخبرة العملية", vol: "تطوع ونشاطات", skills: "مهارات", langs: "لغات" },

      h("header", null, h("h3", { text: v.name || "اسمك هون" }), v.title ? h("p", { class: "muted", text: v.title }) : null,

      ...["summary", "edu", "exp", "vol", "skills", "langs"].map(sec));

  const fields = T35_CV_F.map(([k, l, kind]) => {

    return t35Field(l, c, kind === "area" ? "full" : "");

  const fillCtrls = () => T35_CV_F.forEach(([k]) => (ctrls[k].value = v[k] || ""));
  const htmlFile = () => {

    const sec = (k) => lines(v[k]).length ? `<h2>${t35Esc(L[k])}</h2>` + (k === "summary" ? `<p>${t35Esc(v[k])}</p>` : `<ul>${lines(v[k]).map((x) => `<li>${t35Esc(x)}</li>`).join("")}</ul>`) : "";
    return `<!doctype html><html lang="${v.lang}" dir="${L.dir}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${t35Esc(v.name || "CV")}</title>

  };
  const txtFile = () => { const L = T35_CV_L[v.lang]; return [v.name, v.title, [v.phone, v.email, v.city].filter(Boolean).join(" · "), ...["summary", "edu", "exp", "vol", "skills", "langs"].filter((k) => lines(v[k]).length).map((k) => `\n${L[k]}\n` + (k === "summary" ? v[k] : lines(v[k]).map((x) => "- " + x).join("\n")))].filter(Boolean).join("\n"); };
  const status = h("p", { class: "muted small", "aria-live": "polite" });

      if (!r || typeof r !== "object") throw { code: "invalid_json" };

    h("h4", { text: "معاينة" }), preview,

function toolLetter(el) {

  };
  const out = h("textarea", { id: "t35-lt-out", class: "t35-letter", rows: 14, placeholder: "الرسالة بتظهر هون، وبتقدر تعدّل عليها مثل ما بدك.", oninput: (e) => { v.text = e.target.value; lsSet("p35:letter", v); } });

    t35Ai({ out, btn, stop, onDone: (t) => { v.text = t; lsSet("p35:letter", v); }, prompt:
`Write a scholarship application letter in ${lang}, written by the student in first person. About 220-300 words, warm but formal, clear paragraphs, no headings, no Markdown.

    h("div", { class: "form" },
      inp("grant", "المنحة أو الجهة", "مثال: منحة پراح، منحة الجامعة الاجتماعية"),
      inp("name", "اسمك", ""),
      inp("study", "شو وين بتدرس", "مثال: تمريض، سنة أولى، جامعة بن غوريون", true),
      inp("why", "ليش محتاج الدعم", "وضع العائلة، عدد الإخوة الطلاب، شغل جنب التعليم…", true),
      inp("ach", "إنجازات (اختياري)", "علامات، جوائز، مشاريع", true),
      inp("vol", "تطوع ونشاط بالمجتمع (اختياري)", "", true),
      inp("goal", "هدفك بعد اللقب (اختياري)", "", true)),
    h("div", { class: "row" }, btn, stop), t35AiGate("كتابة المسودة بتحتاج المساعد. بتقدر تكتب الرسالة بنفسك بالمربّع تحت وتنسخها."),
    out,
    h("div", { class: "row" }, t35Copy(() => out.value, out), h("button", { class: "btn sm ghost", type: "button", text: "نزّل (.txt)", onclick: () => out.value.trim() ? saveFile("رسالة-منحة.txt", out.value) : toast("الرسالة فاضية") })),

let ctMeasure = null;

function schDrawList() {
  const box = $("#sch-list"); if (!box) return;
  const q = schState.q.trim();
  const rows = schData.rows.filter((r) => {
    const d = schDays(r);
    if (schState.status === "open" && !schOpen(r)) return false;
    if (schState.status === "closed" && schOpen(r)) return false;
    if (schState.status === "soon" && !(d !== null && d >= 0 && d <= 14)) return false;
    if (schState.region !== "all" && r.region !== schState.region && r.region !== "كل البلاد") return false;
    if (schState.field !== "all" && r.field !== schState.field && r.field !== "كل التخصصات") return false;
    if (schState.cat !== "all" && r.cat !== schState.cat) return false;
    return matches([r.name, r.provider, r.audience, r.source, r.cat].join(" "), q);
  }).sort((a, b) => {
    const da = schDays(a), db_ = schDays(b);
    const ka = da === null ? 1e6 : da < 0 ? 2e6 - da : da, kb = db_ === null ? 1e6 : db_ < 0 ? 2e6 - db_ : db_;
    return ka - kb;
  });
  const c = $("#sch-count"); if (c) c.textContent = schData.rows.length ? `${rows.length} منحة` : "";
  if (rows.length) { box.replaceChildren(...rows.map(schCard)); return; }
  box.replaceChildren(schData.rows.length

// Everything is computed in the browser from the public collections already loaded (S.posts, S.materials,
// S.tutors, S.alumni, PL.thanks). Replies and other teams' collections are not counted.

const PT_RULES = [
  ["material", "مادة أو امتحان بالمكتبة", 10],
  ["offer", "عرض درس", 8],
  ["free", "إضافة لكل درس مجاني أو تطوّعي", 4],
  ["post", "منشور بالمجتمع (سؤال، نصيحة، فرصة)", 3],
  ["request", "طلب مساعدة بالدروس", 1],
  ["thanks", "شخص جديد شكرك", 5],
  ["profile", "ملف كامل (مرة وحدة)", 5],
  ["mentor", "متاح للمساعدة (مرة وحدة)", 5],

const PT_W = Object.fromEntries(PT_RULES.map(([k, , w]) => [k, w]));
const PT_LEVELS = [
  { min: 0, name: "بداية الطريق" }, { min: 20, name: "مشارك" }, { min: 60, name: "فعّال" },
  { min: 150, name: "ملهم" }, { min: 300, name: "سند الفوج" },

const ptBlank = () => ({ material: 0, offer: 0, free: 0, post: 0, question: 0, request: 0, thanks: 0, thanksSent: 0, profile: 0, mentor: 0, points: 0, help: 0 });
// Compute stats for every uid since `since` (ms). Profile/mentor points only count in all-time totals.
function ptCompute(since = 0) {
  const m = {};
  const get = (u) => (m[u] ||= ptBlank());
  const ok = (r) => r.uid && (r.createdAt || 0) >= since;
  S.posts.forEach((p) => { if (!ok(p) || !plVisible("posts", p)) return; const s = get(p.uid); s.post++; if (p.cat === "سؤال" || p.cat === "طلب مساعدة") s.question++; });
  S.materials.forEach((x) => { if (ok(x) && plVisible("materials", x)) get(x.uid).material++; });
  S.tutors.forEach((t) => {
    if (!ok(t) || !plVisible("tutors", t)) return;
    const s = get(t.uid);
    if (t.type === "offer") { s.offer++; if (!t.price) s.free++; } else { s.request++; s.question++; }
  });
  const seen = new Set();
  PL.thanks.forEach((t) => {
    if (!ok(t) || !t.to || t.to === t.uid) return;
    get(t.uid).thanksSent++;
    const key = t.to + "|" + t.uid; if (seen.has(key)) return; seen.add(key);
    get(t.to).thanks++;
  });
  if (!since) Object.values(S.alumni).forEach((a) => {
    const u = a.uid || a.id; if (!u) return; const s = get(u);
    if (a.name && a.year && a.status && (a.field || a.place)) s.profile = 1;
    if (a.mentor) s.mentor = 1;
  });
  for (const s of Object.values(m)) {
    s.points = s.material * PT_W.material + s.offer * PT_W.offer + s.free * PT_W.free + s.post * PT_W.post + s.request * PT_W.request + s.thanks * PT_W.thanks + s.profile * PT_W.profile + s.mentor * PT_W.mentor;
    s.help = s.material + s.offer + s.thanks;
  }

}
function ptLevel(points) {
  let i = 0; PT_LEVELS.forEach((l, j) => { if (points >= l.min) i = j; });
  const next = PT_LEVELS[i + 1];
  return { ...PT_LEVELS[i], i, next, pct: next ? Math.round(((points - PT_LEVELS[i].min) / (next.min - PT_LEVELS[i].min)) * 100) : 100 };
}

const ptDay = (d = new Date()) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
function ptStreak() {
  const days = new Set(lsGet("pt-days", []));
  let cur = 0; const d = new Date();
  if (!days.has(ptDay(d))) d.setDate(d.getDate() - 1);
  while (days.has(ptDay(d))) { cur++; d.setDate(d.getDate() - 1); }
  const sorted = [...days].sort(); let best = 0, run = 0, prev = null;
  sorted.forEach((s) => { const t = new Date(s + "T12:00:00").getTime(); run = prev && Math.round((t - prev) / 864e5) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = t; });

function pfIdeaStats() {
  let n = 0;
  return IDEAS.map((g) => {
    const items = g.items.map((t) => ({ n: ++n, done: t[0] === "*", t: t.replace(/^\*/, "") }));

  });
}

let subsStarted = false;
function startSubs() {

    const prevMine = !!S.alumni[S.uid];

    if (prevMine !== !!S.alumni[S.uid]) renderView(); else renderLists();
  });
  subscribe("posts", { limit: 200 }, (rows) => { S.posts = rows; renderLists(); });
  subscribe("materials", { limit: 500 }, (rows) => { S.materials = rows; renderLists(); });
  subscribe("tutors", { limit: 300 }, (rows) => { S.tutors = rows; renderLists(); });
  subscribe("mod", { order: "updatedAt", limit: 100 }, (rows) => {
    S.mod = Object.fromEntries(rows.map((r) => [r.id, r.map || {}]));
    renderLists();

}
function goLocal() {

}

  } else goLocal();
  startSubs(); buildTabs(); S.view = resolveView(start || S.view); renderView();
}
boot();

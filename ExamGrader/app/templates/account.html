{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h1>حسابي</h1>
  <p class="muted">{{ user.name }} · <span dir="ltr">{{ user.username }}</span> · {{ "مدير" if is_admin else "معلم" }}</p>
  {% if saved %}<div class="alert ok">تم تغيير كلمة المرور. تم تسجيل الخروج من الأجهزة الأخرى.</div>{% endif %}
  {% if error %}<div class="alert err">{{ error }}</div>{% endif %}
  <h2>تغيير كلمة المرور</h2>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>كلمة المرور الحالية<input type="password" name="current" required autocomplete="current-password"></label>
    <label>كلمة المرور الجديدة<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
    <label>تأكيد كلمة المرور الجديدة<input type="password" name="password2" required minlength="8" autocomplete="new-password"></label>
    <button class="btn" type="submit">حفظ</button>
  </form>
</div>
{% endblock %}

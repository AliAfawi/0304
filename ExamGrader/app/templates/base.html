<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}مصحح امتحانات تحليل البيانات{% endblock %}</title>
  {% if standalone %}<style>{{ inline_css | safe }}</style>{% else %}<link rel="stylesheet" href="/static/style.css">{% endif %}
  {% block head %}{% endblock %}
</head>
<body>
  {% if not standalone %}<header class="top">
    <a class="brand" href="/">📊 مصحح امتحانات تحليل البيانات</a>
    {% if user %}<nav>
      <span>{{ user.name }}</span>
      {% if is_admin %}<a href="/users">المستخدمون</a>{% endif %}
      <a href="/account">حسابي</a>
      <form method="post" action="/logout"><button type="submit">خروج</button></form>
    </nav>{% endif %}
  </header>{% endif %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
